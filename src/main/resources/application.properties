#Nombre App
spring.application.name=practica01

#Puerto
server.port=91

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

#Thymeleaf
spring.thymeleaf.cache=false

#Logging
logging.level.root=TRACE
logging.pattern.dateformat=dd HH:mm